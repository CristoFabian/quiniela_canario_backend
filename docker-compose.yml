version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.32
    container_name: quinielas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura_123
      MYSQL_DATABASE: quinielas_deportivas
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin_password_segura_123
      TZ: "America/Mexico_City"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - quinielas_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # Spring Boot API
  # ─────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quinielas-api
    environment:
      # Credenciales admin inicial (VARIABLES DE ENTORNO - FORMA SEGURA)
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin123!@#Segura_Minimo10Caracteres

      # Base de datos
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/quinielas_deportivas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Mexico_City
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin_password_segura_123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect

      # JWT (REEMPLAZA CON VALOR SEGURO EN PRODUCCIÓN)
      JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      JWT_EXPIRATION: "86400000"

      # CORS
      CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://localhost:3000"

      # Almacenamiento (local en desarrollo)
      APP_STORAGE_PROVIDER: "local"
      APP_STORAGE_LOCAL_BASE_DIR: "./uploads"
      APP_UPLOAD_URL_PREFIX: "/perfiles"

      # Logging
      LOGGING_LEVEL_COM_QUINIELAS: "DEBUG"
      LOGGING_LEVEL_ROOT: "INFO"

    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quinielas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/test/publico"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # Nginx (Reverse Proxy - Opcional)
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: quinielas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - quinielas_network

volumes:
  mysql_data:
    driver: local

networks:
  quinielas_network:
    driver: bridge

