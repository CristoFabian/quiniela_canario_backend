spring.application.name=api

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/quinielas_deportivas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Mexico_City
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

# --- JWT ---
# Genera tu propio secreto con al menos 256 bits en Base64
# Ejemplo: openssl rand -base64 64
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# --- CORS ---
# Frontend Angular (ng serve corre en 4200 por defecto)
cors.allowed-origins=http://localhost:4200

# --- Almacenamiento de fotos de perfil ---
app.upload.dir=uploads/perfiles
app.upload.url-prefix=/perfiles

# --- Almacenamiento de comprobantes de pago ---
app.upload.dir.comprobantes=uploads/comprobantes
app.upload.url-prefix.comprobantes=/comprobantes

# Limite de tamano para carga de archivos
# Fotos de perfil: 2 MB (validado en FileStorageService)
# Comprobantes de pago: 5 MB (validado en FileStorageService)
# El limite global de Spring debe ser el mayor de los dos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

