spring.application.name=api

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/quinielas_deportivas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Mexico_City
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
# Evita SQLFeatureNotSupportedException al usar columnas TEXT/CLOB con HikariCP + MySQL
# Connector/J (ver Notificacion.metadata).
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- JWT ---
# Genera tu propio secreto con al menos 256 bits en Base64
# Ejemplo: openssl rand -base64 64
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# --- CORS ---
# Frontend Angular (ng serve corre en 4200 por defecto)
cors.allowed-origins=http://localhost:4200

# --- Almacenamiento de archivos (fotos de perfil y comprobantes) ---
# Backend activo: "local" (disco del servidor, por defecto) u "oci"
# (Oracle Object Storage, API S3-compatible, recomendado para produccion).
app.storage.provider=local

# Directorio base cuando app.storage.provider=local.
# Estructura fisica resultante: {base-dir}/perfiles/... y {base-dir}/comprobantes/...
app.storage.local.base-dir=uploads

# Prefijo de URL publica para las fotos de perfil servidas desde disco local
# (solo aplica con app.storage.provider=local).
app.upload.url-prefix=/perfiles

# --- Configuracion de Oracle Object Storage (app.storage.provider=oci) ---
# Descomentar y completar al desplegar a produccion. Las credenciales son
# "Customer Secret Keys" (Identity -> Users -> Customer Secret Keys en la
# consola de OCI), NO las API Signing Keys del SDK nativo de OCI.
# app.storage.oci.endpoint=https://<namespace>.compat.objectstorage.<region>.oraclecloud.com
# app.storage.oci.region=us-ashburn-1
# app.storage.oci.access-key=${OCI_ACCESS_KEY}
# app.storage.oci.secret-key=${OCI_SECRET_KEY}
# app.storage.oci.bucket=quinielas-uploads
# Solo si el bucket es publico (para exponer fotos de perfil sin pasar por el backend):
# app.storage.oci.public-url-base=https://<namespace>.objectstorage.<region>.oraclecloud.com/n/<namespace>/b/quinielas-uploads/o/perfiles/

# Limite de tamano para carga de archivos
# Fotos de perfil: 2 MB (validado en FileStorageService)
# Comprobantes de pago: 5 MB (validado en FileStorageService)
# El limite global de Spring debe ser el mayor de los dos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

