# ============================================================================
# CONFIGURACIÓN DEL ADMINISTRADOR INICIAL
# ============================================================================
#
# IMPORTANTE: Estas propiedades se usan SOLO en el arranque inicial.
# Si ya existe un ADMIN en la BD, estas se ignoran.
#
# USO EN DESARROLLO (application-dev.properties):
# Descomenta estas líneas:
#
# admin.username=admin
# admin.password=Admin123!@#
#
# Luego ejecuta: mvn spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=dev"
#
# ============================================================================
# USO EN PRODUCCIÓN (Oracle Cloud Free Always)
# ============================================================================
#
# OPCIÓN A: Variables de Entorno (RECOMENDADO)
# ───────────────────────────────────────────
# En OCI Console (Compute > Instance > Cloud Shell):
#
#   export ADMIN_USERNAME="administrador_nombre_secreto"
#   export ADMIN_PASSWORD="contraseña_muy_larga_y_aleatoria_minimo_32_caracteres!"
#
#   java -jar api-0.0.1-SNAPSHOT.jar
#
#
# OPCIÓN B: En archivo application.properties (NO RECOMENDADO - menos seguro)
# ──────────────────────────────────────────────────────────────────────────
# NUNCA commitees esto al repositorio Git. Usa secretos de OCI en su lugar.
#
#   admin.username=tuadmin
#   admin.password=tucontraseña
#
#
# OPCIÓN C: Docker en Oracle Container Registry
# ──────────────────────────────────────────────
# En tu Dockerfile:
#
#   FROM eclipse-temurin:17-jre
#   COPY target/api-0.0.1-SNAPSHOT.jar app.jar
#   ENTRYPOINT ["java","-jar","app.jar"]
#
# Al ejecutar en OCI (Cloud Run o Container Instances):
#
#   gcloud run deploy quinielas-api \
#     --image us-central1-docker.pkg.dev/PROJECT/REPO/quinielas-api:latest \
#     --set-env-vars ADMIN_USERNAME=admin,ADMIN_PASSWORD=xxx \
#     --region us-central1
#
# ============================================================================
# SEGURIDAD - RECOMENDACIONES
# ============================================================================
#
# 1. LONGITUD MÍNIMA: Contraseña >= 10 caracteres
#    Recomendado: >= 32 caracteres con números, símbolos, mayúsculas
#
# 2. NUNCA hardcodees credenciales en application.properties
#    Usa variables de entorno u OCI Vault en su lugar
#
# 3. DESPUÉS DE CREAR EL ADMIN INICIAL:
#    - Accede a http://tudominio/api/admin/usuarios
#    - Crea más usuarios administrativos si es necesario
#    - Desactiva/elimina el usuario admin_username si ya no lo necesitas
#
# 4. EN PRODUCCIÓN, configura HTTPS en tu reverse proxy (nginx/Apache)
#
# ============================================================================

# Credenciales del administrador inicial (SOLO en primer arranque)
# Deja comentadas en production.properties - usa variables de entorno
#
# admin.username=admin
# admin.password=Admin123!@#Segura

